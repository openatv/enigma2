name: updatepot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: 'master'

      - name: cache gettext
        id: gettext-cache
        uses: actions/cache@v4
        with:
          path: ~/gettext
          key: gettext-1.0

      - name: build gettext
        if: steps.gettext-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential xz-utils
          curl -fsSL https://ftpmirror.gnu.org/gnu/gettext/gettext-1.0.tar.xz | tar -xJ
          cd gettext-1.0
          ./configure --prefix="$HOME/gettext" --with-included-libxml --disable-java --disable-csharp --disable-docs --disable-openmp --disable-static --without-emacs
          make -j"$(nproc)"
          make install

      - name: check gettext
        run: |
          echo "$HOME/gettext/bin" >> "$GITHUB_PATH"
          "$HOME/gettext/bin/xgettext" --version | head -n 1

      - name: updatepot
        run: |
          git config --global user.email "bot@openatv.com"
          git config --global user.name "atv enigma po Bot"
          git config advice.addignoredfile false
          git clean -fd
          git checkout master
          cd po
          ./updatepot.sh
          cd ..
          git add -u
          git add * || :
          git commit -m "pot update"
          git remote add upstream https://${GITHUB_TOKEN}@github.com/openatv/enigma2.git > /dev/null 2>&1
          git push --quiet upstream master || echo "failed to push with error $?"
