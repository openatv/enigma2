name: updatepot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: 'master'

      - name: install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          # f-string support in xgettext needs gettext 0.24 or newer
          minversion="0.24"
          version=$(xgettext --version | head -n 1 | grep -oE '[0-9]+(\.[0-9]+)+' | tail -n 1)
          echo "xgettext $version"
          if [ "$(printf '%s\n' "$minversion" "$version" | sort -V | head -n 1)" != "$minversion" ]; then
            echo "xgettext $version is too old, $minversion or newer is required"
            exit 1
          fi

      - name: updatepot
        run: |
          git config --global user.email "bot@openatv.com"
          git config --global user.name "atv enigma po Bot"
          git config advice.addignoredfile false
          git clean -fd
          git checkout master
          cd po
          ./updatepot.sh
          cd ..
          git add -u
          git add * || :
          git commit -m "pot update"
          git remote add upstream https://${GITHUB_TOKEN}@github.com/openatv/enigma2.git > /dev/null 2>&1
          git push --quiet upstream master || echo "failed to push with error $?"
